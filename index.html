<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Conversor de Texto para Áudio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="cabecalho">
        <h1>Voz do Daniel</h1>
          <h2>Conversor Texto-Áudio</h2>
        
    </div>
    <div class="container">
        <textarea id="text-input" placeholder="Digite seu texto aqui..." rows="6"></textarea>

        <div class="controls">
            <select id="voice-select">
                <option value="">Selecionar Voz...</option>
            </select>
            <button id="play-btn">Ouvir</button>
            <button id="stop-btn">Parar</button>
        </div>

        <div id="legenda-container" class="legenda-container">
            <span class="legenda-titulo">Legenda:</span>
            <p id="legenda-texto">O texto narrado aparecerá aqui em tempo real.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
